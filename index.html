<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتجر</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2a2c;--mut:#667476;--ac:#0f5c63;--ac2:#c8872b;--line:#dde4e3;--bad:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#121a1b;--card:#1b2628;--ink:#e8eeee;--mut:#9aabad;--ac:#2b8f99;--ac2:#e0a24a;--line:#2c3b3d;--bad:#e8776d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.6}
header{position:sticky;top:0;background:var(--ac);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;z-index:5}
header h1{font-size:19px;margin:0;flex:1;font-weight:800}
header button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
header button.on{background:#fff;color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:14px}h2{font-size:18px;margin:6px 0 12px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:70px}label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.p img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line);display:block}
.p h3{font-size:15px;margin:8px 0 2px}.old{text-decoration:line-through;color:var(--mut);font-size:13px;margin-inline-start:6px}
.pr{font-weight:800;color:var(--ac)}.tag{display:inline-block;background:var(--ac2);color:#fff;font-size:12px;border-radius:6px;padding:0 7px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 14px;font:inherit;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.g{flex:1;min-width:140px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}.stats b{display:block;font-size:22px;color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.wa{position:fixed;bottom:16px;inset-inline-start:16px;background:#1fa855;color:#fff;border-radius:30px;padding:10px 16px;text-decoration:none;font-weight:700;z-index:4}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:20}
#inv{display:none;position:fixed;inset:0;background:#fff;color:#000;overflow:auto;padding:20px;z-index:30}
#inv table{width:100%;border-collapse:collapse}#inv td,#inv th{border-bottom:1px solid #ccc;padding:6px;text-align:start}
@media print{body>*:not(#inv){display:none!important}#inv{display:block!important;position:static}.noprint{display:none}}

:root{--bg:#f5f7fb;--card:#fff;--ink:#0f1b33;--mut:#6b7a90;--ac:#1d4ed8;--ac2:#f59e0b;--line:#e6ebf4;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#eaf0fb;--mut:#93a3bb;--ac:#4f83ff;--ac2:#fbbf24;--line:#233048;--bad:#f87171}}
header{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:12px 16px}
header h1{font-size:20px;font-weight:800}
header button{background:transparent;color:var(--mut);font-weight:700;padding:7px 14px;border-radius:20px}
header button.on{background:var(--ac);color:#fff}
.hero{background:linear-gradient(135deg,var(--ac),#6d28d9);color:#fff;border-radius:22px;padding:26px 22px;margin:2px 0 16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff22}
.hero h2{font-size:26px;margin:0 0 6px;font-weight:800}.hero p{margin:0;opacity:.9;font-size:14px}
.search{border-radius:14px;padding:12px 16px;margin-bottom:6px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pc{background:var(--card);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 2px 10px #0f1b330d;border:1px solid var(--line)}
.pc img,.pc .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
.pb{padding:10px 12px 12px}.pn{font-weight:700;font-size:15px}.pp{margin:4px 0 8px}.pp b{color:var(--ac);font-size:15px}.pp s{color:var(--mut);font-size:12px;margin-inline-start:6px}
.add{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:8px;font:inherit;font-weight:700;cursor:pointer}
.off{position:absolute;top:8px;inset-inline-start:8px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
.chip{padding:6px 16px}.btn{border-radius:12px}.card{border-radius:16px}
.foot{text-align:center;margin:36px 0 18px}.foot a{font-size:11px;color:var(--mut);opacity:.4;text-decoration:none}
</style></head><body>
<header><h1 id="hn"></h1><button id="b-shop" onclick="go('shop')">المنتجات</button><button id="b-cart" onclick="go('cart')"></button></header>
<main id="app"><div class="empty">جارٍ التحميل…</div></main><footer class="foot"><a href="#admin" onclick="go('admin');return false">إدارة</a></footer><div id="inv"></div>
<script>
const U='https://smlowmwcqghotsxqtvyy.supabase.co',K='sb_publishable_VdLIY4E-gLEl36WKmkW5gw_UaKpvt3d';
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sess=null;try{sess=JSON.parse(localStorage.getItem('sess'))}catch(e){}
function setSess(j){sess={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+j.expires_in};try{localStorage.setItem('sess',JSON.stringify(sess))}catch(e){}}
function clr(){sess=null;adm=false;try{localStorage.removeItem('sess')}catch(e){}}
async function tok(){if(!sess)return null;if(sess.exp-Date.now()/1000<60){const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.rt})});if(!r.ok){clr();return null}setSess(await r.json())}return sess.at}
async function rest(p,o={}){const t=await tok();const r=await fetch(U+'/rest/v1/'+p,{method:o.m||'GET',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal',...(t?{Authorization:'Bearer '+t}:{})},body:o.b?JSON.stringify(o.b):undefined});if(!r.ok)throw new Error(await r.text());const x=await r.text();return x?JSON.parse(x):null}
async function fn(p,body,auth){const t=auth?await tok():null;const r=await fetch(U+'/functions/v1/api'+p,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Authorization:'Bearer '+(t||K)},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'حدث خطأ');return j}
let S={set:{name:'متجري',currency:'UM',open:true,whatsapp:'22232656368',phone:'',policy:'الاستبدال خلال 3 أيام من الاستلام بشرط سلامة المنتج.'},cats:[],prods:[],cities:[],orders:[]};
let view='shop',q='',cat=0,cart={},adm=false,tab='orders',edit=null,busy=false,done=null,okey=uid(),co={name:'',phone:'',whatsapp:'',city:'',area:'',address:'',note:''};
function uid(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
const fmt=n=>Number(n||0).toLocaleString('en-US')+' '+S.set.currency;
const price=p=>p.sale_price>0&&p.sale_price<p.price?p.sale_price:p.price;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)};
function go(v){view=v;done=null;location.hash=v;if(v=='admin'&&sess&&!adm)enter();else render()}
async function load(){try{const[s,c,p,ci]=await Promise.all([rest('settings?id=eq.1'),rest('categories?order=sort,id'),rest('products?active=eq.true&order=sort,id.desc'),rest('cities?order=id')]);if(s&&s[0])S.set={...S.set,...s[0].data};S.cats=c;S.prods=p;S.cities=ci;if(!co.city&&ci[0])co.city=ci[0].name}catch(e){toast('تعذر تحميل البيانات')}render()}
async function enter(){try{const ok=await rest('rpc/is_admin',{m:'POST',b:{}});if(ok!==true){clr();toast('هذا الحساب ليس مديراً');return render()}adm=true;await loadAdmin()}catch(e){clr();render()}}
async function loadAdmin(){try{const[p,o]=await Promise.all([rest('products?order=id.desc'),rest('orders?order=created_at.desc&limit=200')]);S.prods=p;S.orders=o}catch(e){toast('تعذر تحميل بيانات الإدارة')}render()}
function render(){document.title=S.set.name;$('#hn').textContent=S.set.name;
 const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#b-cart').textContent='السلة ('+n+')';
 ['shop','cart'].forEach(v=>$('#b-'+v).className=view==v?'on':'');
 $('#app').innerHTML=view=='cart'?cartV():view=='admin'?(adm?adminV():loginV()):shopV()}
const cartItems=()=>Object.keys(cart).map(id=>({p:S.prods.find(x=>x.id==id),q:cart[id]})).filter(x=>x.p);
function shopV(){
 const l=S.prods.filter(p=>p.active&&(!cat||p.category_id==cat)&&(!q||p.name.includes(q)));
 const c=S.cats.length?'<div class="chips"><button class="chip '+(!cat?'on':'')+'" onclick="cat=0;render()">الكل</button>'+S.cats.map(x=>'<button class="chip '+(cat==x.id?'on':'')+'" onclick="cat='+x.id+';render()">'+esc(x.name)+'</button>').join('')+'</div>':'';
 const g=l.map(p=>{const sale=price(p)<p.price;return '<div class="pc">'+(p.images&&p.images[0]?'<img loading="lazy" src="'+esc(p.images[0])+'" alt="">':'<div class="ph"></div>')+(sale?'<span class="off">-'+Math.round((1-price(p)/p.price)*100)+'%</span>':'')+'<div class="pb"><div class="pn">'+esc(p.name)+'</div><div class="pp"><b>'+fmt(price(p))+'</b>'+(sale?'<s>'+fmt(p.price)+'</s>':'')+'</div>'+(p.stock>0?'<button class="add" onclick="add('+p.id+')">+ أضف إلى السلة</button>':'<span class="mut">نفد المخزون</span>')+'</div></div>'}).join('');
 return (S.set.open?'':'<div class="card bad">استقبال الطلبات متوقف مؤقتاً.</div>')+'<div class="hero"><h2>'+esc(S.set.name)+'</h2><p>تسوّق بسهولة — الدفع عند الاستلام</p></div><input class="search" id="sq" placeholder="ابحث عن منتج" value="'+esc(q)+'" oninput="q=this.value;render();const i=$(\'#sq\');i.focus();i.setSelectionRange(99,99)">'+c+(l.length?'<div class="grid">'+g+'</div>':'<div class="empty">'+(S.prods.length?'لا توجد نتائج.':'لا توجد منتجات بعد.')+'</div>')+'<div class="card" style="margin-top:18px"><b>التوصيل والاستبدال</b><div class="mut">الدفع عند الاستلام فقط. '+esc(S.set.policy)+'</div></div>'+(S.set.phone?'<div class="mut" style="margin-top:8px"><a href="tel:'+esc(S.set.phone)+'">اتصل بالمتجر: '+esc(S.set.phone)+'</a></div>':'')+'<a class="wa" href="https://wa.me/'+String(S.set.whatsapp).replace(/\D/g,'')+'">واتساب</a>'}
function add(id){const p=S.prods.find(x=>x.id==id);if((cart[id]||0)>=p.stock)return toast('الكمية المتوفرة '+p.stock);cart[id]=(cart[id]||0)+1;render();toast('تمت الإضافة')}
function qty(id,d){const p=S.prods.find(x=>x.id==id);const v=(cart[id]||0)+d;if(v<=0)delete cart[id];else if(v<=p.stock)cart[id]=v;else toast('الكمية المتوفرة '+p.stock);render()}
const sub=()=>cartItems().reduce((a,x)=>a+price(x.p)*x.q,0);
const city=()=>S.cities.find(c=>c.name==co.city||c.n==co.city);
const fee=()=>{const c=S.cities.find(c=>c.name==co.city);return !c||c.free?0:Number(c.fee)};
function cartV(){
 if(done)return '<div class="card"><h2>تم استلام طلبك ✓</h2><p>رقم الطلب: <b>'+esc(done)+'</b></p><p class="mut">سنتواصل معك لتأكيد التوصيل. الدفع عند الاستلام.</p><button class="btn" onclick="go(\'shop\')">متابعة التسوق</button></div>';
 const it=cartItems();if(!it.length)return '<div class="empty">السلة فارغة.</div>';
 const c=S.cities.find(x=>x.name==co.city),multi=S.cities.length>1;
 return '<h2>سلة المشتريات</h2>'+it.map(x=>'<div class="card row" style="margin-bottom:8px"><div class="g"><b>'+esc(x.p.name)+'</b><div class="mut">'+fmt(price(x.p))+'</div></div><button class="btn s sm" onclick="qty('+x.p.id+',-1)">−</button><b>'+x.q+'</b><button class="btn s sm" onclick="qty('+x.p.id+',1)">+</button></div>').join('')+
 '<div class="card"><h2>بيانات التوصيل</h2><label>رقم الهاتف</label><input type="tel" inputmode="tel" value="'+esc(co.phone)+'" oninput="co.phone=this.value"><label>العنوان</label><input value="'+esc(co.address)+'" oninput="co.address=this.value">'+(multi?'<label>المدينة</label><select onchange="co.city=this.value;render()">'+S.cities.map(x=>'<option '+(x.name==co.city?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>':'')+(c&&c.eta?'<div class="mut" style="margin-top:6px">مدة التوصيل: '+esc(c.eta)+'</div>':'')+'</div>'+
 '<div class="card" style="margin-top:8px"><div class="row"><span class="g">المنتجات</span><b>'+fmt(sub())+'</b></div><div class="row"><span class="g">التوصيل</span><b>'+(fee()?fmt(fee()):'مجاني')+'</b></div><div class="row"><span class="g">الإجمالي</span><b class="pr">'+fmt(sub()+fee())+'</b></div><p class="mut">طريقة الدفع: الدفع عند الاستلام.'+(c&&c.min_order>0?' الحد الأدنى للطلب '+fmt(c.min_order)+'.':'')+'</p><button class="btn" style="width:100%" '+(busy?'disabled':'')+' onclick="order()">'+(busy?'جارٍ الإرسال…':'تأكيد الطلب')+'</button></div>'}
async function order(){
 if(busy)return;if(!S.set.open)return toast('استقبال الطلبات متوقف مؤقتاً');
 if(!S.cities.length||!co.city)return toast('التوصيل غير متاح حالياً');
 if(!co.phone.trim()||!co.address.trim())return toast('أدخل رقم الهاتف والعنوان');
 busy=true;render();
 try{const r=await fn('/order',{key:okey,city:co.city,note:'',customer:{name:'عميل',phone:co.phone,whatsapp:co.phone,area:'',address:co.address},items:cartItems().map(x=>({id:x.p.id,qty:x.q}))});
  cart={};done=r.order_no;okey=uid();co={...co,phone:'',address:''};load()}
 catch(e){toast(e.message)}busy=false;render()}
function loginV(){return '<div class="card" style="max-width:340px;margin:30px auto"><h2>دخول المدير</h2><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><br><br><button class="btn" onclick="login()">دخول</button></div>'}
async function login(){const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});if(!r.ok)return toast('بيانات الدخول غير صحيحة');setSess(await r.json());enter()}
const ST={new:'طلب جديد',confirmed:'مؤكد',prep:'قيد التجهيز',shipped:'تم الشحن',done:'تم التسليم',cancel:'ملغى'};
function adminV(){const T={orders:'الطلبات',products:'المنتجات',cats:'الأقسام',ship:'التوصيل',set:'الإعدادات'};
 return '<div class="tabs">'+Object.keys(T).map(k=>'<button class="chip '+(tab==k?'on':'')+'" onclick="tab=\''+k+'\';edit=null;render()">'+T[k]+'</button>').join('')+'<button class="chip" onclick="clr();render()">خروج</button></div>'+({orders:ordersV,products:prodsV,cats:catsV,ship:shipV,set:setV})[tab]()}
function ordersV(){
 const ok=S.orders.filter(o=>o.status!='cancel'),low=S.prods.filter(p=>p.stock<=3&&p.active),cnt=k=>S.orders.filter(o=>o.status==k).length;
 const td=new Date().toDateString(),today=ok.filter(o=>new Date(o.created_at).toDateString()==td).reduce((a,o)=>a+Number(o.total),0);
 return '<div class="stats"><div class="card">الطلبات<b>'+S.orders.length+'</b></div><div class="card">جديدة<b>'+cnt('new')+'</b></div><div class="card">قيد التجهيز<b>'+cnt('prep')+'</b></div><div class="card">مشحونة<b>'+cnt('shipped')+'</b></div><div class="card">مكتملة<b>'+cnt('done')+'</b></div><div class="card">ملغاة<b>'+cnt('cancel')+'</b></div><div class="card">الإيرادات<b style="font-size:16px">'+fmt(ok.reduce((a,o)=>a+Number(o.total),0))+'</b></div><div class="card">مبيعات اليوم<b style="font-size:16px">'+fmt(today)+'</b></div></div>'+(low.length?'<div class="card" style="border-color:var(--ac2)">مخزون منخفض: '+low.map(p=>esc(p.name)+' ('+p.stock+')').join('، ')+'</div>':'')+
 (S.orders.length?S.orders.map(o=>{const bad=o.wa_status=='pending'||o.wa_status=='failed';return '<div class="card" style="margin-top:8px"><div class="row"><b class="g">'+esc(o.order_no)+'</b><span class="mut">'+new Date(o.created_at).toLocaleString('ar')+'</span></div><div><b>'+esc(o.customer.phone)+'</b></div><div>'+esc(o.customer.address)+(S.cities.length>1?' — '+esc(o.customer.city):'')+'</div><div class="mut">'+o.items.map(i=>esc(i.name)+' ×'+i.qty).join('، ')+'</div><div class="pr">'+fmt(o.total)+'</div><div class="mut '+(bad?'bad':'')+'">واتساب: '+({pending:'لم يُرسل',failed:'فشل الإرسال',sent:'أُرسل',delivered:'وصل',read:'قُرئ'}[o.wa_status]||o.wa_status)+'</div><div class="row" style="margin-top:6px"><select class="g" onchange="stat(\''+o.id+'\',this.value)">'+Object.keys(ST).map(k=>'<option value="'+k+'" '+(o.status==k?'selected':'')+'>'+ST[k]+'</option>').join('')+'</select><button class="btn s sm" onclick="inv(\''+o.id+'\')">الفاتورة</button>'+(bad?'<button class="btn sm" onclick="resend(\''+o.id+'\')">إعادة إرسال واتساب</button>':'')+'</div></div>'}).join(''):'<div class="empty">لا توجد طلبات بعد.</div>')}
async function stat(id,v){try{await rest('rpc/set_order_status',{m:'POST',b:{p_id:id,p_status:v}});loadAdmin()}catch(e){toast('تعذر تغيير الحالة')}}
async function resend(id){try{const r=await fn('/resend',{id},true);toast(r.ok?'تم الإرسال':'فشل: '+(r.err==='not_configured'?'واتساب غير مفعّل بعد':'راجع الإعدادات'))}catch(e){toast(e.message)}loadAdmin()}
function inv(id){const o=S.orders.find(x=>x.id==id),c=o.customer;
 $('#inv').innerHTML='<div class="noprint"><button class="btn" onclick="window.print()">طباعة / حفظ PDF</button> <button class="btn s" onclick="$(\'#inv\').style.display=\'none\'">إغلاق</button></div><h1>'+esc(S.set.name)+'</h1><p>فاتورة رقم: <b>'+esc(o.order_no)+'</b><br>التاريخ: '+new Date(o.created_at).toLocaleDateString('ar')+'</p><p>الهاتف: '+esc(c.phone)+'<br>العنوان: '+esc(c.city+' - '+c.area+' - '+c.address)+'</p><table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr>'+o.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+fmt(i.price)+'</td><td>'+fmt(i.price*i.qty)+'</td></tr>').join('')+'</table><p>المنتجات: '+fmt(o.subtotal)+'<br>التوصيل: '+fmt(o.delivery_fee)+'<br><b>الإجمالي: '+fmt(o.total)+'</b><br>طريقة الدفع: الدفع عند الاستلام</p>';$('#inv').style.display='block'}
function prodsV(){
 if(edit){const p=edit;return '<div class="card"><h2>'+(p.id?'تعديل منتج':'منتج جديد')+'</h2>'+[['name','اسم المنتج','text'],['price','السعر الأصلي','number'],['sale_price','سعر التخفيض (اختياري)','number'],['stock','الكمية المتوفرة','number']].map(f=>'<label>'+f[1]+'</label><input type="'+f[2]+'" value="'+esc(p[f[0]])+'" oninput="edit.'+f[0]+'=this.value">').join('')+'<label>الوصف والمواصفات</label><textarea oninput="edit.description=this.value">'+esc(p.description)+'</textarea><label>القسم</label><select onchange="edit.category_id=+this.value||null"><option value="">بدون قسم</option>'+S.cats.map(c=>'<option value="'+c.id+'" '+(p.category_id==c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>الصورة</label><input type="file" accept="image/*" onchange="img(this)">'+(p.images&&p.images[0]?'<img src="'+esc(p.images[0])+'" style="width:90px;margin-top:6px;border-radius:8px">':'')+'<label><input type="checkbox" style="width:auto" '+(p.active?'checked':'')+' onchange="edit.active=this.checked"> ظاهر في المتجر</label><label><input type="checkbox" style="width:auto" '+(p.featured?'checked':'')+' onchange="edit.featured=this.checked"> منتج مميز</label><div class="row" style="margin-top:12px"><button class="btn" onclick="saveP()">حفظ</button><button class="btn s" onclick="edit=null;render()">إلغاء</button></div></div>'}

async function img(el){const f=el.files[0];if(!f)return;try{const bm=await createImageBitmap(f),k=Math.min(1,800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.75)),name=Date.now()+'.jpg',t=await tok();
 const r=await fetch(U+'/storage/v1/object/products/'+name,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'image/jpeg'},body:blob});if(!r.ok)throw 0;edit.images=[U+'/storage/v1/object/public/products/'+name];render()}catch(e){toast('فشل رفع الصورة')}}
async function saveP(){const p=edit;if(!p.name.trim()||!(+p.price>0))return toast('أدخل الاسم والسعر');
 const b={name:p.name.trim(),description:p.description,price:+p.price,sale_price:+p.sale_price||null,stock:Math.max(0,Math.floor(+p.stock||0)),category_id:p.category_id||null,images:p.images||[],active:p.active,featured:p.featured};
 try{await rest(p.id?'products?id=eq.'+p.id:'products',{m:p.id?'PATCH':'POST',b});edit=null;toast('تم الحفظ');loadAdmin()}catch(e){toast('تعذر الحفظ')}}
async function dup(id){const p=S.prods.find(x=>x.id==id);try{await rest('products',{m:'POST',b:{name:p.name+' (نسخة)',description:p.description,price:p.price,sale_price:p.sale_price,stock:p.stock,category_id:p.category_id,images:p.images,active:p.active,featured:p.featured}});loadAdmin()}catch(e){toast('تعذر النسخ')}}
async function del(id){if(!confirm('حذف المنتج؟'))return;try{await rest('products?id=eq.'+id,{m:'DELETE'});loadAdmin()}catch(e){toast('تعذر الحذف')}}
function catsV(){return '<div class="row"><input class="g" id="nc" placeholder="اسم القسم"><button class="btn" onclick="addCat()">إضافة</button></div>'+S.cats.map(c=>'<div class="card row" style="margin-top:8px"><span class="g">'+esc(c.name)+'</span><button class="btn d sm" onclick="delCat('+c.id+')">حذف</button></div>').join('')}

async function delCat(id){try{await rest('categories?id=eq.'+id,{m:'DELETE'});await load();await loadAdmin()}catch(e){toast('تعذر الحذف')}}
function shipV(){return S.cities.map(c=>'<div class="card" style="margin-top:8px"><div class="row"><b class="g">'+esc(c.name)+'</b><button class="btn d sm" onclick="delCity('+c.id+')">حذف</button></div><div class="row"><div class="g"><label>رسوم التوصيل</label><input type="number" value="'+c.fee+'" onchange="upCity('+c.id+',{fee:+this.value})"></div><div class="g"><label>المدة</label><input value="'+esc(c.eta)+'" onchange="upCity('+c.id+',{eta:this.value})"></div><div class="g"><label>أدنى طلب</label><input type="number" value="'+(c.min_order||0)+'" onchange="upCity('+c.id+',{min_order:+this.value})"></div></div><label><input type="checkbox" style="width:auto" '+(c.free?'checked':'')+' onchange="upCity('+c.id+',{free:this.checked})"> توصيل مجاني</label></div>').join('')+'<div class="row" style="margin-top:12px"><input class="g" id="ncity" placeholder="مدينة جديدة"><button class="btn" onclick="addCity()">إضافة مدينة</button></div>'}
async function upCity(id,b){try{await rest('cities?id=eq.'+id,{m:'PATCH',b});const i=S.cities.findIndex(c=>c.id==id);S.cities[i]={...S.cities[i],...b};toast('تم الحفظ')}catch(e){toast('تعذر الحفظ')}}
async function addCity(){const n=$('#ncity').value.trim();if(!n)return;try{await rest('cities',{m:'POST',b:{name:n,fee:0,free:false,eta:''}});await load();render()}catch(e){toast('تعذرت الإضافة')}}
